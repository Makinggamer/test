# Atena project 設定

[ollama]
# M3 / ユニファイドメモリ 24GB 向けの構成（docs/02_proposal.md 5.5 参照）
host = "http://localhost:11434"
character_model = "qwen2.5:7b"   # 配信中に常駐（約5GB）。キャラに model 指定が無い場合の既定
judge_model = "qwen2.5:3b"       # ガーディアン二次判定（約2GB）。配信中に常駐
staff_model = "qwen2.5:14b"      # 記憶要約・ルームマスター等。配信していない時間のみ（約9GB）
timeout_sec = 60

[resources]
max_cpu_pct = 85
max_ram_pct = 88                 # macOS はメモリを積極的にキャッシュに使うため高めに設定
max_gpu_pct = 92
max_vram_pct = 92                # Mac では「Ollama モデル ÷ GPU 利用可能メモリ」
max_gpu_temp_c = 83              # NVIDIA のみ。Mac は下の熱制限で判定
max_swap_mb = 2048               # スワップが増えると配信がカクつく
min_cpu_speed_limit_pct = 85     # macOS の熱による速度制限がこれ未満で critical
warn_ratio = 0.9
unified_gpu_fraction = 0.66      # 24GB の Mac で GPU が使えるメモリの目安（約16GB）
max_concurrent_streams = 1       # PC1台なら1を推奨
# デスクトップアプリ (studio-chat) の「重い処理中」ロック。LoRA 学習などの間は配信を開始しない
external_locks = ["~/vid2anime/.heavy.lock"]
# 配信中に同じロックを置き、アプリ側の重い処理を待たせる（アプリ側がロックを尊重する場合のみ有効）
stream_lock_file = "~/vid2anime/.heavy.lock"
max_stream_hours_per_day = 8
default_stream_vram_mb = 8000    # 配信1枠で Ollama が GPU に載せる量（キャラ7B + 判定3B）

[guardian]
use_llm_judge = true
fail_closed = true               # 判定LLMが落ちたら安全側（遮断）に倒す
violation_alert_threshold = 3    # 7日間でこの件数以上の違反があればマネージャーにタスク起票
# 配信環境として話してほしくない語（PC名、機材名、部屋の特徴など）
env_terms = []
# 他キャラへの攻撃とみなす語。空なら既定リストを使用
hostile_terms = []

[memory]
max_items = 500
max_chars = 60000
keep_recent = 50                 # 直近N件は圧縮しない
digest_batch = 30                # 1回の要約でまとめる件数
viewer_cap = 1000

[approvals]
# 自動承認する自律度レベル。2 を加えると配信スケジュールもマネージャーが自動確定する
auto_approve_levels = [0, 1]

[lounge]
turns = 8
daily = true             # atena daily で1日1回開く（配信中・高負荷なら見送り）
max_participants = 4     # 日次で開くときの最大人数
hobby_ratio = 0.5        # 好きなもの・仕事の雑談回になる確率（残りは配信・収益の情報交換）
pass_after = 3           # この発言数しゃべっていないキャラには話を振る
jitter = 0.15            # 発言順の揺らぎ（0 で毎回同じ順）

[discord]
# ラウンジの会話を Discord で見る。キャラごとの Webhook を config/discord_webhooks.toml に書く
# （見本: config/discord_webhooks.example.toml、手順: docs/10_discord_lounge.md）
enabled = false
webhooks_file = "config/discord_webhooks.toml"
forum = false            # フォーラムチャンネルに流すなら true（ラウンジ1回 = 1投稿）
post_blocked = true      # 規制した発言を「［規制により非表示］」として出す

[youtube]
# どちらか一方を設定。API キー方式は `atena youtube live <キャラ> --video <動画ID>` で接続
api_key = ""
# OAuth 方式（配信中の自分の枠を自動検出）。Google Cloud で作った「デスクトップアプリ」の JSON
client_secret_file = ""          # 例: "config/client_secret.json"（git 管理外にしてください）
token_file = "data/youtube_token.json"
daily_quota = 10000              # 既定の1日割り当て
quota_reserve = 1500             # 配信以外のために残す分
poll_cost = 5                    # チャット取得（liveChatMessages.list）1回のユニット数（確認済み）
expected_stream_hours = 3.0      # この時間割り当てが持つようにポーリング間隔を自動調整

[youtube.fx_rates]               # スパチャの円換算レート（手数料控除前の目安）
JPY = 1.0
USD = 150.0
EUR = 160.0
TWD = 4.6
KRW = 0.11

[voice]
engine = "irodori"               # 声は Irodori のみ（途中で声が変わらないよう予備の声は使わない）
irodori_host = "http://127.0.0.1:8088"   # Irodori-TTS-Server
irodori_model = "irodori-tts"
irodori_num_steps = 0            # 0 = サーバー既定。遅ければ下げる（音質とのトレードオフ）
irodori_timeout_sec = 30         # これを超えたらボイストラブル扱い
max_pending = 3                  # 読み上げ待ちがこれを超えたら古い通常返答は字幕のみ（スパチャのお礼は必ず読む）
retry_after_sec = 60             # ボイストラブル中、声の再挑戦までの間隔（その間は字幕のみ）
trouble_notice = "ただいまボイストラブル中のため、字幕でお届けしています"
no_voice_notice = "本日は字幕でお届けしています"
subtitle_file = "data/obs/subtitle.txt"   # OBS: テキストソース →「ファイルから読み取り」に指定
comment_file = "data/obs/comment.txt"     # 読み上げ中のコメント表示用
notice_file = "data/obs/notice.txt"       # ボイストラブル等の注意書き（普段は空）
srt_dir = "data/streams"                  # 配信ごとの字幕ファイル (SRT)。切り抜き作成に使う

[avatar]
# "pngtuber"（立ち絵、OBS ブラウザソース。標準）/ "vmc"（Inochi2D の Inochi Session など）。空なら表示なし。複数可
# "vtube_studio" も使えるが、配信の透かしを消すのに有料 DLC が必要なため非推奨
engines = []
pngtuber_port = 8771             # OBS ブラウザソース: http://127.0.0.1:8771/
pngtuber_motion = true           # 呼吸・話すときの弾み・表情フェード・感情の動き
pngtuber_blink = true            # まばたき（<感情>_blink.png がある感情のみ）
vmc_host = "127.0.0.1"           # VMC プロトコルの送信先
vmc_port = 39539                 # 受信側（Inochi Session 等）の VMC 受信ポートに合わせる
vmc_blink = true                 # 受信側で自動まばたきするなら false
# vmc_names = { mouth = "A", blink = "Blink", joy = "Joy" }   # 送る名前を変える場合
vts_url = "ws://localhost:8001"
vts_mouth_param = "MouthOpen"
vts_token_file = "data/vts_token"

[learning]
web_enabled = true               # Web から学ぶ（配信外のバッチ）
wiki_lang = "ja"
# 一般 Web 検索: duckduckgo（設定不要）/ searxng（自分で立てたメタ検索）/ brave（API キー）/ none
search_provider = "duckduckgo"
searxng_url = "http://127.0.0.1:8888"
brave_api_key = ""
results_per_query = 2            # 1つの検索語で読む一般サイトの数
respect_robots = true            # robots.txt でクロール禁止のページは読まない
# Wikipedia と同格の「参考資料」として扱うドメイン（末尾一致）。それ以外の一般サイトは一段下の「Web」扱い
trusted_domains = ["wikipedia.org", "go.jp", "ac.jp", "lg.jp", "kotobank.jp"]
topics_per_run = 2               # 1回の学習で調べる話題（好きなもの・専門）の数
queries_per_topic = 2
verify_per_run = 5               # 視聴者に教わった未確認の知識を Web で照合する数
max_facts = 300                  # キャラごとの知識の上限。超えたら記憶マネージャーが整理
max_per_topic = 60               # 1つの話題の上限。超えたら古い知識を要約してまとめる

[stream]
idle_after_sec = 40              # コメントがこの秒数途切れたら、好きな話題で場を繋ぐ
idle_interval_sec = 60           # 場繋ぎトークの最短間隔
max_idle_talks_in_row = 5        # 連続でこれだけ話したら間隔を倍にする

[api]
# デスクトップアプリ連携用（`atena serve`）。127.0.0.1 のみで待ち受けます
host = "127.0.0.1"
port = 8770                      # 8765 はデスクトップアプリ (studio-chat) が使用
token = ""                       # 空なら data/api_token に自動生成
