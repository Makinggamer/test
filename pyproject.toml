[project]
name = "atena"
version = "0.1.0"
description = "Atena project — ローカルLLM(Ollama)で動く AI タレント事務所"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
monitor = ["psutil>=5.9"]
avatar = ["websockets>=12"]           # VTube Studio 連携
shorts = ["Pillow>=10"]               # ラウンジの縦型ショート

[project.scripts]
atena = "atena.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atena*"]
